name: Offline translator build

on:
  push:
    branches:
      - automation/offline-translator-build-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Fetch pinned EN-AR model and ARM64 runtime
        shell: bash
        working-directory: .offline-translator-ci/project
        run: |
          set -euo pipefail
          DEST="app/src/main/assets/models/enar"
          mkdir -p "$DEST" app/src/main/jniLibs/arm64-v8a
          BASE="https://storage.googleapis.com/moz-fx-translations-data--303e-prod-translations-data/models/en-ar/retrain_base-memory_G3CmhwG_TZext3cys-udHg/exported"
          fetch_model() {
            name="$1"; hash="$2"; size="$3"
            curl -fL --retry 3 "$BASE/$name.gz" | gzip -dc > "$DEST/$name"
            test "$(wc -c < "$DEST/$name" | tr -d ' ')" = "$size"
            echo "$hash  $DEST/$name" | sha256sum -c -
          }
          fetch_model model.enar.intgemm.alphas.bin ae659d7045fc2e5d6ba50583586a5d94ee4358d92c019847e37b57a0e627faa8 31561787
          fetch_model vocab.enar.spm 8d93c54aa5e2044c416ec680b5ff9af0227bd698521666e8b1a1ea1b041fbae8 863591
          fetch_model lex.50.50.enar.s2t.bin 2b7194817c5dd9225ca90c0d908cc92e1d6d1f45625781a5feb037ac568d6a61 3139692
          curl -fL --retry 3 --retry-delay 2             https://github.com/cgeo/offline-translator/releases/download/v0.2.6-cgeo.1/libbergamot-sys-arm64-v8a.so             -o app/src/main/jniLibs/arm64-v8a/libbergamot-sys.so
          test "$(wc -c < app/src/main/jniLibs/arm64-v8a/libbergamot-sys.so | tr -d ' ')" = 9010520
          echo "9eb6a03c96f34d965aac84306c4f6316d7cc3cea20e683a99f8ed9133725bb6e  app/src/main/jniLibs/arm64-v8a/libbergamot-sys.so" | sha256sum -c -

      - name: Pure Java preservation test
        shell: bash
        working-directory: .offline-translator-ci/project
        run: |
          set -euo pipefail
          mkdir -p .test
          cat > .test/SelfTest.java <<'JAVA'
          import com.jieshuo.offlinetranslator.engine.TextSegmenter;
          import com.jieshuo.offlinetranslator.engine.TranslationCache;
          import java.util.*;
          public class SelfTest {
            public static void main(String[] a) {
              TextSegmenter s = new TextSegmenter();
              String in = "Hello مرحبا https://example.com/a?x=1 mail@test.example 12:30 file.txt /sdcard/a.bin 😀 world";
              List<TextSegmenter.Piece> p = s.split(in);
              List<String> t = new ArrayList<>();
              for (TextSegmenter.Piece x : p) if (x.translate) t.add(x.value);
              if (!in.equals(s.reassemble(p,t))) throw new AssertionError("lossless reassembly failed");
              String longText = "A long English sentence that should split safely. ".repeat(200);
              for (TextSegmenter.Piece x : s.split(longText))
                if (x.translate && x.value.length() > TextSegmenter.MAX_ENGINE_PIECE_CHARS) throw new AssertionError("piece too long");
              TranslationCache c = new TranslationCache(2,10000);
              c.put("a","A"); c.put("b","B"); c.get("a"); c.put("c","C");
              if (c.get("b") != null || !"A".equals(c.get("a"))) throw new AssertionError("LRU failed");
              System.out.println("PURE_JAVA_SELF_TEST: PASS");
            }
          }
          JAVA
          javac -d .test             app/src/main/java/com/jieshuo/offlinetranslator/engine/TextSegmenter.java             app/src/main/java/com/jieshuo/offlinetranslator/engine/TranslationCache.java             .test/SelfTest.java
          java -cp .test SelfTest
          rm -rf .test

      - name: Build debug APK
        working-directory: .offline-translator-ci/project
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK structure, permissions, ABI, signature and assets
        shell: bash
        working-directory: .offline-translator-ci/project
        run: |
          set -euo pipefail
          REPORT="$GITHUB_WORKSPACE/apk-verify.txt"
          exec > >(tee "$REPORT") 2>&1
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "== APK SHA-256 =="
          sha256sum "$APK"
          echo "== Package / SDK =="
          aapt dump badging "$APK" | sed -n '1,10p'
          aapt dump badging "$APK" | grep -q "package: name='com.jieshuo.offlinetranslator'"
          aapt dump badging "$APK" | grep -q "sdkVersion:'28'"
          aapt dump badging "$APK" | grep -q "targetSdkVersion:'35'"
          echo "== Permissions =="
          PERMS="$(aapt dump permissions "$APK")"
          printf '%s\n' "$PERMS"
          if printf '%s\n' "$PERMS" | grep -q 'android.permission.INTERNET'; then exit 20; fi
          echo "== Alignment =="
          zipalign -c -v 4 "$APK" >/dev/null
          echo "zipalign: PASS"
          echo "== Signature =="
          apksigner verify --verbose --print-certs "$APK"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          unzip -q "$APK" -d "$TMP"
          test -f "$TMP/classes.dex"
          mapfile -t SO < <(find "$TMP/lib" -type f -name '*.so' | sort)
          test "${#SO[@]}" -eq 1
          test -f "$TMP/lib/arm64-v8a/libbergamot-sys.so"
          test -z "$(find "$TMP/lib" -mindepth 1 -maxdepth 1 -type d ! -name arm64-v8a -print -quit)"
          echo "9eb6a03c96f34d965aac84306c4f6316d7cc3cea20e683a99f8ed9133725bb6e  $TMP/lib/arm64-v8a/libbergamot-sys.so" | sha256sum -c -
          readelf -Ws "$TMP/lib/arm64-v8a/libbergamot-sys.so" | grep -q Java_dev_davidv_bergamot_NativeLib_initializeService
          readelf -Ws "$TMP/lib/arm64-v8a/libbergamot-sys.so" | grep -q Java_dev_davidv_bergamot_NativeLib_loadModelIntoCache
          readelf -Ws "$TMP/lib/arm64-v8a/libbergamot-sys.so" | grep -q Java_dev_davidv_bergamot_NativeLib_translateMultiple
          readelf -Ws "$TMP/lib/arm64-v8a/libbergamot-sys.so" | grep -q Java_dev_davidv_bergamot_NativeLib_cleanup
          BASE="$TMP/assets/models/enar"
          echo "ae659d7045fc2e5d6ba50583586a5d94ee4358d92c019847e37b57a0e627faa8  $BASE/model.enar.intgemm.alphas.bin" | sha256sum -c -
          echo "8d93c54aa5e2044c416ec680b5ff9af0227bd698521666e8b1a1ea1b041fbae8  $BASE/vocab.enar.spm" | sha256sum -c -
          echo "2b7194817c5dd9225ca90c0d908cc92e1d6d1f45625781a5feb037ac568d6a61  $BASE/lex.50.50.enar.s2t.bin" | sha256sum -c -
          echo "APK_VERIFY: PASS"

      - name: Package source
        shell: bash
        working-directory: .offline-translator-ci/project
        run: |
          set -euo pipefail
          zip -qr "$GITHUB_WORKSPACE/JieshuoOfflineTranslator-0.3.0-source.zip" .             -x 'app/src/main/assets/models/enar/*'                'app/src/main/jniLibs/*'                'app/build/*'                '.gradle/*'

      - uses: actions/upload-artifact@v4
        with:
          name: jieshuo-offline-translator
          path: |
            .offline-translator-ci/project/app/build/outputs/apk/debug/app-debug.apk
            apk-verify.txt
            JieshuoOfflineTranslator-0.3.0-source.zip
          if-no-files-found: error
